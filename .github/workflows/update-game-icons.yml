
name: Update game icons

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 1 * *"

  push:
    branches:
      - main
    paths:
      - "Scripts/**"
      - "games.json"
      - "Requirements.txt"
      - ".github/workflows/update-game-icons.yml"

permissions:
  contents: write

jobs:
  update-icons:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Requirements.txt

      - name: Update game icons
        run: python Scripts/update_game_icon.py

      - name: Commit changed icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Assets/game_icons

          if git diff --cached --quiet; then
            echo "No icon changes to commit."
          else
            git commit -m "Update game icons"
            git push
          fi
